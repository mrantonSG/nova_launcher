<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova DSO Tracker</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="app-header">
      <h1><span class="wordmark">Nova</span> DSO Tracker</h1>
    </header>

    <main id="app-content">
      <div class="status-group">
        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-label" id="status-label" aria-live="polite">Checking status&hellip;</span>
        </div>

        <p class="status-detail" id="status-detail"></p>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="primary-action" type="button" disabled>
          <span class="spinner" id="spinner" hidden></span>
          <span id="primary-action-label">&hellip;</span>
        </button>
        <button class="btn btn-secondary" id="stop-action" type="button" disabled>Stop</button>
      </div>

      <div class="update-banner" id="launcher-update-banner" hidden>
        <div class="update-banner-row">
          <div class="update-banner-body">
            <span class="update-banner-text" id="launcher-update-text"></span>
            <div class="update-banner-links">
              <button class="btn-link" id="launcher-notes-toggle" type="button">View Release Notes</button>
              <button class="btn-link" id="launcher-update-open" type="button">Open Release Page</button>
            </div>
          </div>
          <button class="update-banner-dismiss" id="launcher-update-dismiss" type="button" aria-label="Dismiss">&times;</button>
        </div>
        <div class="update-banner-notes" id="launcher-release-notes" hidden></div>
      </div>

      <div class="update-banner" id="image-update-banner" hidden>
        <div class="update-banner-row">
          <div class="update-banner-body">
            <span class="update-banner-text" id="image-update-text">An updated Nova image is available</span>
            <div class="update-banner-choice">
              <button class="btn btn-primary btn-sm" id="image-update-now" type="button">Update Now</button>
              <button class="btn btn-secondary btn-sm" id="image-update-skip" type="button">Skip This Version</button>
            </div>
            <div class="update-banner-links">
              <button class="btn-link" id="image-notes-toggle" type="button">View Release Notes</button>
              <button class="btn-link" id="image-update-open" type="button">Open Release Page</button>
            </div>
          </div>
          <button class="update-banner-dismiss" id="image-update-dismiss" type="button" aria-label="Dismiss">&times;</button>
        </div>
        <div class="update-banner-notes" id="image-release-notes" hidden></div>
      </div>

      <p class="error-box" id="error-box" role="alert" hidden></p>
    </main>

    <script src="./lib/app.js"></script>
  </body>
</html>
